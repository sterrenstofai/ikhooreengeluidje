name: Foto's ophalen

# Downloadt foto's van instrumenten en apparaten van Wikimedia Commons en commit ze in site/fotos.
# Handmatig te starten; foto's die al goed staan worden overgeslagen.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Foto's ophalen
        run: python3 scripts/fotos_ophalen.py
      - name: Committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/fotos site/data/fotos.json
          git diff --cached --quiet || git commit -m "Foto's van instrumenten bijgewerkt"
          git pull --rebase origin main
          git push
