[build]
  publish = "site"

[[redirects]]
  from = "/nummer/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/instrument/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/nummers"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/instrumenten"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/onderzoekjes"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/onderzoekjes/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/mijn"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/sporen"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/kinderen"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/ontdek"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.mzstatic.com; font-src 'self'; connect-src 'self' https://audio-ssl.itunes.apple.com https://huggingface.co https://*.hf.co; worker-src 'self'; media-src 'self' https://audio-ssl.itunes.apple.com blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), interest-cohort=()"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/klanken/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/fotos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
